version: "3.7"
services:
  app:
    build:
      args:
        user: ccmak
        uid: 1000
      context: ./
      dockerfile: ./docker-laravel/docker-compose/Dockerfile.app
    image: php:8.2-fpm
    container_name: docker-laravel-app_1
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./${APP_NAME}/www:/var/www:z
    networks:
      - docker-laravel
  db:
    image: mysql:8.0
    container_name: docker-laravel-db_1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./${APP_NAME}/docker-compose/mysql:/docker-entrypoint-initdb.d:z
    networks:
      - docker-laravel
  nginx:
    image: nginx:alpine
    container_name: docker-laravel-nginx_1
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./${APP_NAME}/www:/var/www:z
      - ./${APP_NAME}/docker-compose/nginx/docker-laravel.conf:/etc/nginx/conf.d/default.conf:z
    networks:
      - docker-laravel
networks:
  docker-laravel:
    external: true
