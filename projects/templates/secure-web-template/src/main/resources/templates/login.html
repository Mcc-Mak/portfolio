<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="">
		<meta name="author" content="">
		<title>Please sign in</title>
		<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
		<link href="https://getbootstrap.com/docs/4.0/examples/signin/signin.css" rel="stylesheet" crossorigin="anonymous">
	</head>
	<body>
		<section class="vh-100 bg-image" style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
			<div class="mask d-flex align-items-center h-100 gradient-custom-3">
				<div class="container h-100">
					<div class="row d-flex justify-content-center align-items-center h-100">
						<div class="col-12 col-md-9 col-lg-7 col-xl-6">
							<div class="card" style="border-radius: 15px;">
								<div class="card-body p-5">
									<h2 class="text-uppercase text-center mb-5">Login</h2>

									<form th:action="@{/login}" method="post">
										<div class="form-outline mb-4">
											<input type="text" id="username" name="username" class="form-control form-control-lg" />
											<label class="form-label" for="username">Username</label>
										</div>
										<div class="form-outline mb-4">
											<input type="password" id="password" name="password" class="form-control form-control-lg" />
											<label class="form-label" for="password">Password</label>
										</div>
										<pre><div th:if="${param.error}" style="color: red">[Warning] Invalid username and password.</div></pre>
										<pre><div th:if="${param.logout}" style="color: blue">[Info] You have been logged out.</div></pre>
										<div class="d-flex justify-content-center">
											<button type="submit" class="btn btn-success btn-block btn-lg gradient-custom-4 text-body">Login</button>
										</div>
										<p class="text-center text-muted mt-5 mb-0">Haven't have an account yet? <a href="/register" class="fw-bold text-body"><u>Register here</u></a></p>
									</form>

								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</body>
</html>
