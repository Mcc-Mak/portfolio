<script type="module" charset="utf-8">
  const SECRET_KEY = "";
  const LOGIN_API_URL = "http://192.168.9.128:8888/login";

  async function showNotification(settings) {
    return await Swal.fire(settings);
  }

  function signString(key, toSign) {
    const hash = CryptoJS.HmacSHA256(toSign, key);
    return CryptoJS.enc.Base64.stringify(hash);
  }

  function encryptHmacsha256(password) {
    return CryptoJS.SHA256(password).toString();
  }

  $(document).ready(async function () {
    // remove cookie by [name="jwt"]
    document.cookie = "jwt=null; max-age=0";

    // [button:login] event.click
    $('[name="login"]').on('click', async function (e) {
      e.preventDefault();

      const username = $('[name="username"]').val();
      const password = $('[name="password"]').val();
      const hashedPassword = encryptHmacsha256(password);
      const signedString = signString(SECRET_KEY, hashedPassword);

      const settings = {
        "url": LOGIN_API_URL,
        "method": "POST",
        "headers": {
          "Content-Type": "application/json",
          "username": username,
          "hashed": signedString,
          "key": SECRET_KEY
        },
      };

      const res = await $.ajax({ ...settings });
      document.cookie = `jwt=${res}`;

      showNotification({
        icon: 'success',
        text: 'Successfully login!',
        allowOutsideClick: false,
      });
    });
  });
</script>
