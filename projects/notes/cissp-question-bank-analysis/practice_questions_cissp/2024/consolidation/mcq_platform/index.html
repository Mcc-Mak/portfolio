    addQ(209, "Domain 7", "Mitigating an attack involves two logically separate tasks: eradication and _____.", opts([{ letter: "A", text: "Identification" }, { letter: "B", text: "Containment" }, { letter: "C", text: "Remediation" }, { letter: "D", text: "Recovery" }]), ["D"], "single", true, "NIST Incident Response pairs Eradication with Recovery in the third phase.");
    addQ(212, "Domain 7", "ITIL distinguishes changes based on urgency. Which is NOT one of those levels?", opts([{ letter: "A", text: "Standard" }, { letter: "B", text: "Critical" }, { letter: "C", text: "Normal" }, { letter: "D", text: "Emergency" }]), ["B"], "single", true, "ITIL categories: Standard, Normal, and Emergency. 'Critical' is not a change type.");
    addQ(213, "Domain 7", "What is typically used to validate the integrity of a backup?", opts([{ letter: "A", text: "Compare size of original to backup" }, { letter: "B", text: "Some form of integrity check" }, { letter: "C", text: "Algorithm from backup manufacturer" }, { letter: "D", text: "Restoration to different location then integrity check" }]), ["D"], "single", true, "The definitive method is performing an actual test restoration to a different location and verifying.");
    addQ(220, "Domain 7", "What is BEST for a hospital with critical systems in an area prone to power outages?", opts([{ letter: "A", text: "Basic UPS for entire hospital" }, { letter: "B", text: "Advanced UPS with scalable runtime for critical systems only" }, { letter: "C", text: "UPS for EHR only, generators for others" }, { letter: "D", text: "Multi-layered: UPS for all critical systems and backup generators for entire hospital" }]), ["D"], "single", true, "Healthcare requires maximum availability: UPS for instantaneous protection plus generators for extended outages.");

    // ========================= DOMAIN 8 =========================
    addQ(224, "Domain 8", "The Software Engineering Institute's CMMI focuses on which of the following?", opts([{ letter: "A", text: "Software development methodologies" }, { letter: "B", text: "Systems integration" }, { letter: "C", text: "Process management" }, { letter: "D", text: "Software testing and evaluation" }]), ["C"], "single", false, "SW-CMMI is a process improvement methodology for organizations to mature to better levels.");
    addQ(225, "Domain 8", "Which CMM level defines processes as controlled using quantitative techniques?", opts([{ letter: "A", text: "Repeatable" }, { letter: "B", text: "Defined" }, { letter: "C", text: "Managed" }, { letter: "D", text: "Optimizing" }]), ["C"], "single", false, "Level 4 in CMMI is quantitatively managed.");
    addQ(228, "Domain 8", "When thinking about malware, is a hoax dangerous?", opts([{ letter: "A", text: "Yes, always" }, { letter: "B", text: "No, never" }, { letter: "C", text: "Sometimes" }, { letter: "D", text: "Both A and B" }]), ["C"], "single", false, "Hoaxes usually warn about non-existent viruses and instruct users to delete files or forward warnings.");
    addQ(229, "Domain 8", "APT is another name for which of the following?", opts([{ letter: "A", text: "Class of trojans" }, { letter: "B", text: "Class of viruses" }, { letter: "C", text: "Class of worms" }, { letter: "D", text: "Multidimensional attacks" }]), ["D"], "single", false, "APT combines viruses, trojans, worms, and rootkits into multidimensional attacks.");
    addQ(232, "Domain 8", "Which attack allows an authorized user to obtain more information from a database than intended?", opts([{ letter: "A", text: "Bypass" }, { letter: "B", text: "Inference" }, { letter: "C", text: "Aggregation" }, { letter: "D", text: "Aggregation and inference combined" }]), ["D"], "single", false, "Combining pieces from disparate sources may produce unintended situational intelligence.");
    addQ(233, "Domain 8", "When considering databases, what is a 'deadly embrace'?", opts([{ letter: "A", text: "Data contamination" }, { letter: "B", text: "A deadlock" }, { letter: "C", text: "A DoS" }, { letter: "D", text: "None the above" }]), ["B"], "single", false, "A deadlock occurs when two processes each hold resources the other needs, preventing completion.");
    addQ(236, "Domain 8", "Which SQL language concept is used by DBAs to establish and control access to data?", opts([{ letter: "A", text: "DCL" }, { letter: "B", text: "DML" }, { letter: "C", text: "DDL" }, { letter: "D", text: "DTL" }]), ["A"], "single", false, "Data Control Language (DCL) is used to establish and control access to data.");
    addQ(237, "Domain 8", "Which is not a way to handle management of complex software sets?", opts([{ letter: "A", text: "Code reuse" }, { letter: "B", text: "Reforming" }, { letter: "C", text: "Refactoring" }, { letter: "D", text: "Data modeling" }]), ["B"], "single", false, "Reforming does not exist as a software management technique in this context.");
    addQ(240, "Domain 8", "Database models need security controls, multiuser sharing, fault tolerance, recovery, and what else?", opts([{ letter: "A", text: "Transaction persistence" }, { letter: "B", text: "Ability to back up data" }, { letter: "C", text: "Different user levels" }, { letter: "D", text: "Ability to survive hardware failure" }]), ["A"], "single", false, "Transaction persistence ensures database state is consistent after transactions.");
    // Question-only from Domain 8
    addQ(230, "Domain 8", "Which virus does not actually touch the target file but takes advantage of precedence within the system?", opts([{ letter: "A", text: "Multipartite" }, { letter: "B", text: "Boot sector infector" }, { letter: "C", text: "Companion" }, { letter: "D", text: "Script" }]), ["C"], "single", true, "Companion virus creates a separate file that executes instead of the legitimate program due to path precedence.");
    addQ(231, "Domain 8", "Software design errors causing malfunction when attacker provides unvalidated information are best described as?", opts([{ letter: "A", text: "Buffer overflow" }, { letter: "B", text: "Race condition" }, { letter: "C", text: "SQL" }, { letter: "D", text: "Malformed input" }]), ["D"], "single", true, "Malformed input vulnerabilities cover all cases of unvalidated input causing unexpected behavior.");
    addQ(239, "Domain 8", "Which would not be classified as a nonfunctional requirement?", opts([{ letter: "A", text: "Performance" }, { letter: "B", text: "Scalability" }, { letter: "C", text: "Usability" }, { letter: "D", text: "They are all examples of nonfunctional requirements" }]), ["D"], "single", true, "Performance, scalability, and usability are all classic nonfunctional requirements.");

    // State management
    let userAnswers = new Array(QUESTIONS_DATA.length).fill(null).map(() => []);
    let feedbackVisible = new Array(QUESTIONS_DATA.length).fill(false);
    let isSubmitted = false;
    let questionResults = new Array(QUESTIONS_DATA.length).fill(null);

    // Helper to check if a question is correctly answered
    function isQuestionCorrect(qIdx) {
      const q = QUESTIONS_DATA[qIdx];
      const selected = userAnswers[qIdx] || [];
      const correctSet = new Set(q.correct);
      return selected.length === q.correct.length && selected.every(l => correctSet.has(l));
    }

    function evaluateAllQuestions() {
      const results = [];
      for (let i = 0; i < QUESTIONS_DATA.length; i++) {
        results.push({
          isCorrect: isQuestionCorrect(i),
          hasAnswer: (userAnswers[i] && userAnswers[i].length > 0)
        });
      }
      return results;
    }

    function computeScore() {
      let total = 0;
      for (let i = 0; i < QUESTIONS_DATA.length; i++) {
        if (isQuestionCorrect(i)) total++;
      }
      return total;
    }

    function updateStats() {
      const total = QUESTIONS_DATA.length;
      const answered = userAnswers.filter(a => a && a.length > 0).length;
      const score = isSubmitted ? computeScore() : 0;
      document.getElementById('totalCount').innerText = total;
      document.getElementById('answeredCount').innerText = answered;
      document.getElementById('scoreValue').innerText = score;
      document.getElementById('totalPossible').innerText = total;
      if (isSubmitted) {
        document.getElementById('finalScoreMsg').innerHTML = `🏆 ${score} / ${total} (${Math.round(score / total * 100)}%)`;
      } else {
        document.getElementById('finalScoreMsg').innerHTML = `— / ${total}`;
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      if (!container) return;
      container.innerHTML = '';
      QUESTIONS_DATA.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        
        // Add submitted result styling
        if (isSubmitted) {
          const isCorrect = questionResults[idx]?.isCorrect;
          if (isCorrect === true) card.classList.add('submitted-correct');
          else if (isCorrect === false) card.classList.add('submitted-wrong');
        }
        
        const qHeader = document.createElement('div');
        qHeader.className = 'question-header';
        
        // Build result indicator for submitted state
        let resultIndicator = '';
        if (isSubmitted) {
          const isCorrect = questionResults[idx]?.isCorrect;
          const hasAnswer = questionResults[idx]?.hasAnswer;
          if (isCorrect === true) {
            resultIndicator = '<span class="result-indicator result-correct">✓ Correct</span>';
          } else if (isCorrect === false) {
            resultIndicator = '<span class="result-indicator result-wrong">✗ Incorrect</span>';
          } else if (!hasAnswer) {
            resultIndicator = '<span class="result-indicator result-unanswered">⚠ Unanswered</span>';
          }
        }
        
        qHeader.innerHTML = `<div class="q-meta"><span class="domain-tag">${q.domain}</span><span class="q-type">${q.type === 'multiple' ? '✅ Multiple answers' : '⚪ Single choice'}</span></div><div>Q${idx + 1}${resultIndicator}</div>`;
        
        const qTextDiv = document.createElement('div');
        qTextDiv.className = 'question-text';
        if (q.isQuestionOnly) qTextDiv.classList.add('question-only-mode');
        qTextDiv.innerHTML = `<strong>${q.text}</strong>`;
        
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-area';
        
        q.options.forEach(opt => {
          const row = document.createElement('div');
          row.className = 'option-row';
          if (isSubmitted) row.classList.add('disabled-option');
          
          const input = document.createElement('input');
          input.type = q.type === 'multiple' ? 'checkbox' : 'radio';
          input.name = `q${idx}`;
          input.value = opt.letter;
          input.checked = userAnswers[idx]?.includes(opt.letter) || false;
          if (isSubmitted) input.disabled = true;
          
          if (!isSubmitted) {
            input.addEventListener('change', (e) => {
              updateAnswer(idx, opt.letter, e.target.checked, q.type);
            });
          }
          
          const label = document.createElement('label');
          label.innerHTML = `<strong>${opt.letter}.</strong> ${opt.text}`;
          row.appendChild(input);
          row.appendChild(label);
          optionsDiv.appendChild(row);
        });
        
        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback-area';
        feedbackDiv.id = `fb-${idx}`;
        
        // Enhanced feedback for submitted state
        if (isSubmitted && !questionResults[idx]?.isCorrect && questionResults[idx]?.hasAnswer) {
          feedbackDiv.innerHTML = `<strong>📘 Correct answer(s):</strong> ${q.correct.join(', ')}<br><strong>Explanation:</strong> ${q.feedback}`;
        } else {
          feedbackDiv.innerHTML = `<strong>📘 Explanation:</strong> ${q.feedback}`;
        }
        
        const actionDiv = document.createElement('div');
        actionDiv.className = 'action-buttons';
        
        const checkBtn = document.createElement('button');
        checkBtn.innerText = '🔍 Check Answer';
        if (!isSubmitted) {
          checkBtn.classList.add('primary');
          checkBtn.addEventListener('click', () => showFeedbackForQuestion(idx));
        } else {
          checkBtn.disabled = true;
          checkBtn.style.opacity = '0.5';
          checkBtn.style.cursor = 'not-allowed';
        }
        
        const clearBtn = document.createElement('button');
        clearBtn.innerText = '✖ Clear answers';
        if (!isSubmitted) {
          clearBtn.addEventListener('click', () => clearUserAnswers(idx));
        } else {
          clearBtn.disabled = true;
          clearBtn.style.opacity = '0.5';
          clearBtn.style.cursor = 'not-allowed';
        }
        
        actionDiv.appendChild(checkBtn);
        actionDiv.appendChild(clearBtn);
        card.appendChild(qHeader);
        card.appendChild(qTextDiv);
        card.appendChild(optionsDiv);
        card.appendChild(feedbackDiv);
        card.appendChild(actionDiv);
        container.appendChild(card);
        
        if (feedbackVisible[idx] && !isSubmitted) feedbackDiv.classList.add('show-feedback');
      });
      updateStats();
    }

    function updateAnswer(qIdx, letter, isChecked, type) {
      if (isSubmitted) return;
      
      let current = [...(userAnswers[qIdx] || [])];
      if (type === 'single') {
        current = isChecked ? [letter] : [];
      } else {
        if (isChecked && !current.includes(letter)) current.push(letter);
        else if (!isChecked) current = current.filter(l => l !== letter);
      }
      userAnswers[qIdx] = current;
      
      if (feedbackVisible[qIdx]) {
        feedbackVisible[qIdx] = false;
        const fbDiv = document.getElementById(`fb-${qIdx}`);
        if (fbDiv) fbDiv.classList.remove('show-feedback');
      }
      updateStats();
      
      const container = document.getElementById('questionsContainer');
      if (container) {
        const inputs = container.querySelectorAll(`input[name="q${qIdx}"]`);
        inputs.forEach(inp => {
          inp.checked = userAnswers[qIdx].includes(inp.value);
        });
      }
    }

    function showFeedbackForQuestion(idx) {
      if (isSubmitted) return;
      feedbackVisible[idx] = true;
      const fbDiv = document.getElementById(`fb-${idx}`);
      if (fbDiv) fbDiv.classList.add('show-feedback');
    }

    function clearUserAnswers(idx) {
      if (isSubmitted) return;
      userAnswers[idx] = [];
      feedbackVisible[idx] = false;
      renderQuestions();
    }

    function submitPaper() {
      if (isSubmitted) {
        // If already submitted, confirm before resetting to allow retake
        if (confirm('Paper has already been submitted. Do you want to reset and take the exam again?')) {
          resetAll();
        }
        return;
      }
      
      // Check if any answers are selected
      const totalAnswered = userAnswers.filter(a => a && a.length > 0).length;
      if (totalAnswered === 0) {
        if (confirm('No answers selected. Are you sure you want to submit an empty paper?')) {
          isSubmitted = true;
          questionResults = evaluateAllQuestions();
          renderQuestions();
        }
        return;
      }
      
      isSubmitted = true;
      questionResults = evaluateAllQuestions();
      const score = computeScore();
      const total = QUESTIONS_DATA.length;
      const percentage = Math.round(score / total * 100);
      
      // Show submission results
      setTimeout(() => {
        alert(`Paper Submitted!\n\nYour Score: ${score}/${total} (${percentage}%)\n\n${percentage >= 70 ? '🎉 Congratulations! You passed!' : '📚 Keep studying and try again!'}`);
      }, 100);
      
      renderQuestions();
      
      // Change submit button text
      const submitBtn = document.getElementById('submitPaperBtn');
      if (submitBtn) {
        submitBtn.textContent = '📝 Retake Exam';
        submitBtn.classList.remove('success');
        submitBtn.classList.add('warning');
      }
    }

    function resetAll() {
      userAnswers = new Array(QUESTIONS_DATA.length).fill(null).map(() => []);
      feedbackVisible.fill(false);
      isSubmitted = false;
      questionResults.fill(null);
      renderQuestions();
      
      const submitBtn = document.getElementById('submitPaperBtn');
      if (submitBtn) {
        submitBtn.textContent = '📝 Submit Paper';
        submitBtn.classList.remove('warning');
        submitBtn.classList.add('success');
      }
      
      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Event listeners
    document.getElementById('submitPaperBtn')?.addEventListener('click', submitPaper);
    document.getElementById('globalResetBtn')?.addEventListener('click', resetAll);
    
    renderQuestions();
  </script>
</body>

</html>
