      { id: 43, domain: "1. Security and Risk Management", text: "Which type of risk assessment should the team employ in the following scenario? A software development company has recently launched an innovative product they believe is unparalleled in the market. To effectively manage potential risks associated with their new product, the company's risk management team decides to evaluate risks in a manner that best suits their unique business model and product offerings. Given the company's belief in the uniqueness of their product and lack of comparable market data, the team must conduct the right type of risk assessment to measure risks associated with their innovative product.", options: ["A. Qualitative", "B. Quantitative", "C. Either", "D. Both"], correct: "A", type: "single", hasAnswer: true },

      { id: 45, domain: "1. Security and Risk Management", text: "What is the primary purpose of a data classification policy?", options: ["A. To assign sensitivity levels to data based on impact of loss", "B. To encrypt all data", "C. To back up data daily", "D. To delete outdated data"], correct: "A", type: "single", hasAnswer: false },
      { id: 46, domain: "1. Security and Risk Management", text: "Which type of security control is PRIMARILY involved in the implementation of new policies and procedures for handling sensitive customer data?", options: ["A. Administrative", "B. Logical", "C. Technical", "D. Physical"], correct: "A", type: "single", hasAnswer: true },
      { id: 47, domain: "1. Security and Risk Management", text: "Which security engineering technical management process collects, analyzes, and reports security-related data?", options: ["A. Project planning", "B. Decision making", "C. Risk management", "D. Measurement"], correct: "D", type: "single", hasAnswer: true },
      { id: 48, domain: "1. Security and Risk Management", text: "Which of the following best describes a 'risk avoidance' strategy?", options: ["A. Terminating the activity that creates the risk", "B. Purchasing insurance", "C. Implementing security controls", "D. Accepting the potential loss"], correct: "A", type: "single", hasAnswer: false },
      { id: 49, domain: "1. Security and Risk Management", text: "What is the primary purpose of a security metrics program?", options: ["A. To measure and improve security effectiveness", "B. To encrypt sensitive data", "C. To conduct penetration testing", "D. To manage user access"], correct: "A", type: "single", hasAnswer: false },
      { id: 50, domain: "1. Security and Risk Management", text: "Which of the following is NOT a methodology used in threat modeling?", options: ["A. OCTAVE", "B. TRIKE", "C. STRIDE", "D. Threat-X"], correct: "D", type: "single", hasAnswer: true },
      { id: 51, domain: "1. Security and Risk Management", text: "Because it is imperative that the organization applies the same risk-management methodologies to the supply chain as the organization does for its own internal operations, which of the following operations should the organization apply?", options: ["A. Governance reviews", "B. Site surveys", "C. Formal security audits", "D. All the above"], correct: "D", type: "single", hasAnswer: true },
      { id: 52, domain: "1. Security and Risk Management", text: "Supply chain failures can devastate the operations of any organization. Which is the driving process necessary to ensure a safe and secure supply chain?", options: ["A. Identify your suppliers.", "B. Identify your supplier's locations.", "C. Identify the risks.", "D. Identify the need."], correct: "C", type: "single", hasAnswer: true },
      { id: 53, domain: "1. Security and Risk Management", text: "What kind of risks should the company in the following scenario be particularly vigilant about? A software development company is in the process of enhancing its product security protocols. As part of this initiative, the company decides to implement a Software Bill of Materials (SBOM) for all its products.", options: ["A. Financial risks", "B. Compatibility risks", "C. Security vulnerabilities", "D. Operational risks"], correct: "C", type: "single", hasAnswer: true },
      { id: 54, domain: "1. Security and Risk Management", text: "What is the key difference between training and awareness?", options: ["A. Training is focused on guiding behavior and awareness is focused on building proficiency.", "B. Training is focused on building proficiency and awareness is focused on guiding behavior.", "C. Training is aimed at everyone whereas awareness is aimed at only a select few.", "D. Awareness is aimed at everyone whereas training is aimed at only a select few."], correct: "B", type: "single", hasAnswer: true },
      { id: 55, domain: "1. Security and Risk Management", text: "What are the key advantages the bank can expect in the following scenario? A regional bank is planning to enhance its cybersecurity posture in response to the growing threat of cyberattacks, particularly phishing scams. The IT security team proposes conducting controlled phishing campaigns as a proactive measure.", options: ["A. Identifying vulnerable systems", "B. Enhancing employee awareness and preparedness", "C. Improving financial stability", "D. Streamlining IT processes"], correct: "B", type: "single", hasAnswer: true },

      // ========== DOMAIN 2: Asset Security ==========
      { id: 58, domain: "2. Asset Security", text: "Which of the following addresses an organization's ability to use its own information reliably and confidently, knowing that it is free from interference by others?", options: ["A. Information classification", "B. Information management", "C. Information categorization", "D. Information ownership"], correct: "A", type: "single", hasAnswer: true },
      { id: 59, domain: "2. Asset Security", text: "What is the purpose of marking and labeling in the context of asset security management?", options: ["A. Marking is the external identification of assets, while labeling involves embedding security attributes in internal data structures.", "B. Marking involves educating employees on proper information handling, while labeling is the process of securely disposing of sensitive data.", "C. Marking is the process of physically destroying storage media, while labeling is the external communication of an asset's assigned classification.", "D. Marking and labeling are synonymous terms referring to the placement of relevant information on physical assets, such as paper documents or hard disks."], correct: "A", type: "single", hasAnswer: true },
      { id: 60, domain: "2. Asset Security", text: "Network and systems security is what type of asset?", options: ["A. Hardware", "B. Software", "C. Information", "D. Firmware"], correct: "B", type: "single", hasAnswer: true },
      { id: 61, domain: "2. Asset Security", text: "How is a customer database categorized (in terms of asset classification)?", options: ["A. Hardware, as it involves physical servers where the database is stored", "B. Software, as it includes the database management system used to manage the customer data", "C. Information, as it represents an intangible set of data containing customer details", "D. Firmware, as it is integral to the functioning of the hardware where the database is hosted"], correct: "C", type: "single", hasAnswer: true },
      { id: 62, domain: "2. Asset Security", text: "Which of the following BEST exemplifies an intangible asset?", options: ["A. A company vehicle", "B. Brand reputation", "C. An office building", "D. Manufacturing equipment"], correct: "B", type: "single", hasAnswer: true },
      { id: 63, domain: "2. Asset Security", text: "Which of the following assets is not traditionally considered tangible?", options: ["A. A router", "B. Corporate offices", "C. Software", "D. A laptop"], correct: "C", type: "single", hasAnswer: true },
      { id: 64, domain: "2. Asset Security", text: "What is the primary responsibility of a data controller under GDPR?", options: ["A. Determining the purposes and means of processing personal data", "B. Physically securing storage media", "C. Conducting security audits", "D. Installing antivirus software"], correct: "A", type: "single", hasAnswer: false },
      { id: 65, domain: "2. Asset Security", text: "Which role is accountable for the protection of data while in custody?", options: ["A. Data owner", "B. Data controller", "C. Data custodian", "D. Data steward"], correct: "C", type: "single", hasAnswer: false },
      { id: 66, domain: "2. Asset Security", text: "Who is responsible for the data content, context, and the associated business rules?", options: ["A. The data owner", "B. The data controller", "C. The data custodian", "D. The data steward"], correct: "D", type: "single", hasAnswer: true },
      { id: 67, domain: "2. Asset Security", text: "Which action distinguishes the data processor role from other data management roles?", options: ["A. Processing data based on proper controls", "B. Determining the value of data and access policies", "C. Responsibility for data content, context, and business rules", "D. Accountability for protecting data while in custody"], correct: "D", type: "single", hasAnswer: true },
      { id: 68, domain: "2. Asset Security", text: "What is data remanence?", options: ["A. Residual data remaining after deletion or erasure", "B. Data encrypted at rest", "C. Data in transit over networks", "D. Data backup copies stored offsite"], correct: "A", type: "single", hasAnswer: false },
      { id: 69, domain: "2. Asset Security", text: "Which of the following is considered a secure method for data sanitization?", options: ["A. Degaussing", "B. Quick formatting", "C. Simple file deletion", "D. Recycling the storage media"], correct: "A", type: "single", hasAnswer: false },
      { id: 70, domain: "2. Asset Security", text: "Which of these approaches BEST aligns with proper data retention practices and regulatory compliance in the following scenario? An Information Security Analyst at an international consulting firm handles a diverse range of sensitive client data, including financial records, legal documents, and personal information. The firm has recently revised its data retention policy to align with industry standards, laws, and regulations.", options: ["A. Retaining all client data indefinitely to ensure no potentially useful information is lost", "B. Applying the longest known retention period for all types of data in the organization, regardless of the nature of the data", "C. Documenting a records schedule that specifies the retention period for each type of information and ensuring all departments adhere to this schedule without exceeding these periods", "D. Deleting all client records after a single standard period, such as five years, to simplify the data retention process"], correct: "C", type: "single", hasAnswer: true },
      { id: 71, domain: "2. Asset Security", text: "Which of the following should be considered a source of data remanence?", options: ["A. Central Processing Unit (CPU) registers", "B. Random Access Memory (RAM)", "C. Solid State Drives (SSDs)", "D. All the above"], correct: "D", type: "single", hasAnswer: true },
      { id: 72, domain: "2. Asset Security", text: "Which of these actions is MOST effective in the following scenario? The Information Security Officer at a law firm regularly handles sensitive client information, including legal documents, personal data, and confidential case strategies. In the context of the law firm's data security practices, the Information Security Officer must mitigate the risks associated with data remanence.", options: ["A. Regularly updating antivirus software on all firm computers", "B. Implementing a policy for the frequent change of user passwords", "C. Using data wiping techniques that overwrite the storage media multiple times", "D. Restricting access to sensitive data based on user roles and privileges"], correct: "C", type: "single", hasAnswer: true },
      { id: 73, domain: "2. Asset Security", text: "Which form of data destruction reduces the chances of the recovery of data remanence?", options: ["A. Clearing", "B. Purging", "C. Formatting", "D. Destruction"], correct: "B", type: "single", hasAnswer: true },
      { id: 74, domain: "2. Asset Security", text: "For how long can financial records be retained?", options: ["A. For as long as the organization wants to keep them.", "B. The retention period should be the longest of all organizational policies.", "C. There is no preset period.", "D. The retention period is defined by jurisdiction and (or) regulatory requirements."], correct: "D", type: "single", hasAnswer: true },
      { id: 75, domain: "2. Asset Security", text: "What is the primary purpose of a data retention schedule?", options: ["A. To specify how long each type of data must be kept", "B. To encrypt all stored data", "C. To classify data by sensitivity", "D. To ensure daily backups"], correct: "A", type: "single", hasAnswer: false },
      { id: 76, domain: "2. Asset Security", text: "Which of the following is an example of a tangible asset?", options: ["A. Server hardware", "B. Corporate logo", "C. Customer database", "D. Trade secret"], correct: "A", type: "single", hasAnswer: false },
      { id: 77, domain: "2. Asset Security", text: "What is the primary purpose of data minimization?", options: ["A. To collect only the personal data necessary for a specified purpose", "B. To encrypt all stored data", "C. To back up data frequently", "D. To delete all data after one year"], correct: "A", type: "single", hasAnswer: false },
      { id: 78, domain: "2. Asset Security", text: "A baseline that requires the use of strong passwords, strong encryption, watermarks, and real-time monitoring would be an example of what classification level?", options: ["A. Low", "B. Medium", "C. Moderate", "D. High"], correct: "D", type: "single", hasAnswer: true },
      { id: 79, domain: "2. Asset Security", text: "Which of the following is an example of third-party baseline catalogs that can guide organizations in producing their baseline requirements?", options: ["A. International and national standards organizations", "B. Industry sector standards or recommendations", "C. Other companies, preferably with similar business objectives and of comparable size", "D. All the above"], correct: "D", type: "single", hasAnswer: true },
      { id: 80, domain: "2. Asset Security", text: "Generally speaking, who or what provides link encryption?", options: ["A. Users", "B. Certain software", "C. Service providers", "D. The organization"], correct: "C", type: "single", hasAnswer: true },
      { id: 81, domain: "2. Asset Security", text: "What is the primary purpose of data minimization?", options: ["A. To limit data collection to what is directly necessary", "B. To encrypt all stored data", "C. To back up data frequently", "D. To delete all data after one year"], correct: "A", type: "single", hasAnswer: false },
      { id: 82, domain: "2. Asset Security", text: "A Virtual Private Network (VPN) uses what form of encryption to protect data in transmission?", options: ["A. Symmetric", "B. Asymmetric", "C. Link", "D. End-to-end"], correct: "D", type: "single", hasAnswer: true },
      { id: 83, domain: "2. Asset Security", text: "Which of these statements accurately describes an aspect of link encryption and its potential impact on data security in the following scenario? A Network Security Specialist at an international corporation frequently transmits sensitive corporate data across various global locations. Given the nature of the data and the diverse transmission routes, the company is exploring enhanced encryption methods to secure its data in transit. The corporation is evaluating the use of link encryption for its data communications across satellite links, telephone circuits, and T-1 lines.", options: ["A. Link encryption encrypts only the content of the data packet, leaving the routing information unencrypted, thus making it susceptible to traffic analysis attacks.", "B. With link encryption, the data packet, including the routing information, is encrypted at the source and remains encrypted until it reaches the final destination, without decryption at intermediate points.", "C. Link encryption encrypts both the data and the routing information in the packet, requiring decryption and re-encryption at each node in the communication path, potentially exposing data at these points.", "D. Link encryption is less effective in providing traffic confidentiality compared to end-to-end encryption, as it does not conceal the addressing information from potential observers."], correct: "C", type: "single", hasAnswer: true },
      { id: 84, domain: "2. Asset Security", text: "Which form of encryption does a Virtual Private Network (VPN) typically use to protect data in transmission, ensuring the confidentiality and integrity of the data from the sender to the receiver?", options: ["A. Symmetric encryption, where the same key is used for both encryption and decryption of the data", "B. Asymmetric encryption, where two different keys are used, one for encryption and another for decryption", "C. Link encryption, which is applied by service providers along the communication path", "D. End-to-end encryption, where the data is encrypted at the start of the transmission by the sender and is decrypted by the receiver"], correct: "D", type: "single", hasAnswer: true },

      // ========== DOMAIN 3: Security Architecture and Engineering ==========
      { id: 85, domain: "3. Security Architecture and Engineering", text: "Granting users only the permissions required to carry out a task(s) is known as what?", options: ["A. Need to know", "B. Separation of duties", "C. Defense in depth", "D. Least privilege"], correct: "D", type: "single", hasAnswer: true },
      { id: 86, domain: "3. Security Architecture and Engineering", text: "The original defense-in-depth model defined all but which of the following as a layer of defense?", options: ["A. Data", "B. Software", "C. Application", "D. Host"], correct: "B", type: "single", hasAnswer: true },
      { id: 87, domain: "3. Security Architecture and Engineering", text: "Which security model focuses on the movement of information throughout a system?", options: ["A. State machine model", "B. Information flow model", "C. Noninterference model", "D. Ring model"], correct: "B", type: "single", hasAnswer: true },
      { id: 88, domain: "3. Security Architecture and Engineering", text: "Kerckhoffs's Principal asserts that a cryptographic system will remain secure even if everything about it is public knowledge except which of the following?", options: ["A. The algorithm", "B. The process", "C. The key", "D. If everything is known, then the system cannot be secure."], correct: "C", type: "single", hasAnswer: true },
      { id: 89, domain: "3. Security Architecture and Engineering", text: "Which security engineering technical process provides security-related system data and information?", options: ["A. Business and mission analysis", "B. System requirements and definition process", "C. Design definition process", "D. System analysis process"], correct: "D", type: "single", hasAnswer: true },
      { id: 90, domain: "3. Security Architecture and Engineering", text: "Which security-engineering enabling process defines the security requirements used to assess the qualifications, selection, and ongoing training of personnel?", options: ["A. Portfolio management", "B. Human resource management (HRM)", "C. Quality management", "D. Knowledge management"], correct: "B", type: "single", hasAnswer: true },
      { id: 91, domain: "3. Security Architecture and Engineering", text: "What is the primary purpose of a security kernel?", options: ["A. To enforce access controls and mediate all access between subjects and objects", "B. To encrypt all data at rest", "C. To manage backup and recovery operations", "D. To monitor network traffic for intrusions"], correct: "A", type: "single", hasAnswer: false },
      { id: 92, domain: "3. Security Architecture and Engineering", text: "Which of the following is a characteristic of a trusted computing base (TCB)?", options: ["A. It contains all hardware and software components critical to security policy enforcement", "B. It is always physically isolated from other systems", "C. It cannot be updated after initial deployment", "D. It only applies to cloud-based systems"], correct: "A", type: "single", hasAnswer: false },
      { id: 93, domain: "3. Security Architecture and Engineering", text: "Industrial Control Systems (ICS) are used to monitor and control machinery in factories, refineries, transportation systems, and many other similar settings. Which of the following components are ruggedized controllers that use specialized components to provide real-time control?", options: ["A. Programmable Logic Controllers (PLC)", "B. Supervisory Control and Data Acquisition (SCADA)", "C. Distributed Control Systems (DCS)", "D. None of these"], correct: "A", type: "single", hasAnswer: true },
      { id: 94, domain: "3. Security Architecture and Engineering", text: "Which type of industrial control system component should the engineering team select in the following scenario? An engineering team at a company specializing in renewable energy is working on a new wind farm project. The team is considering various industrial control system components to manage the turbines effectively. They seek a solution that offers robust real-time control and can withstand the environmental challenges present in wind turbines and wind farm settings.", options: ["A. Programmable Logic Controller (PLC)", "B. Supervisory Control and Data Acquisition (SCADA)", "C. Distributed Control System (DCS)", "D. Remote Terminal Unit (RTU)"], correct: "A", type: "single", hasAnswer: true },
      { id: 95, domain: "3. Security Architecture and Engineering", text: "The concepts of Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) may be familiar, but they have been extended to include those in the following list of possible answer choices. All the following are defined in ISO/IEC 17788 except which?", options: ["A. Communication as a Service (CaaS)", "B. Compute as a Service (CompaaS)", "C. Network as a Service (NaaS)", "D. Data Storage as a Service (DSaaS)"], correct: "B", type: "single", hasAnswer: true },
      { id: 96, domain: "3. Security Architecture and Engineering", text: "What is the primary purpose of a cryptographic nonce?", options: ["A. To prevent replay attacks by ensuring uniqueness", "B. To encrypt large volumes of data", "C. To generate digital signatures", "D. To hash passwords securely"], correct: "A", type: "single", hasAnswer: false },
      { id: 97, domain: "3. Security Architecture and Engineering", text: "What is the primary purpose of a security model?", options: ["A. To provide a formal framework for implementing security policies", "B. To encrypt organizational data", "C. To manage user authentication", "D. To conduct security audits"], correct: "A", type: "single", hasAnswer: false },
      { id: 98, domain: "3. Security Architecture and Engineering", text: "What encryption system, invented in 1882 by Frank Miller, is unbreakable?", options: ["A. The one-time pad", "B. The Scytale Cipher", "C. The ROT13 Cipher", "D. The Vigenere Cipher"], correct: "A", type: "single", hasAnswer: true },
      { id: 99, domain: "3. Security Architecture and Engineering", text: "Asymmetric algorithms are known as trapdoor functions. What is a trapdoor function?", options: ["A. A potential weakness", "B. A calculation that is easy to perform in one direction but infeasible to perform in the reverse order", "C. A calculation that is easy to perform in two directions", "D. A calculation that provides a mechanism that allows a developer to gain access to the algorithm for maintenance"], correct: "B", type: "single", hasAnswer: true },
      { id: 100, domain: "3. Security Architecture and Engineering", text: "What is the primary purpose of a cryptographic nonce?", options: ["A. To ensure each cryptographic operation produces unique output", "B. To encrypt data", "C. To generate random keys", "D. To hash passwords"], correct: "A", type: "single", hasAnswer: false },
      { id: 101, domain: "3. Security Architecture and Engineering", text: "Which of the following is a symmetric encryption algorithm?", options: ["A. AES", "B. RSA", "C. ECC", "D. Diffie-Hellman"], correct: "A", type: "single", hasAnswer: false },
      { id: 102, domain: "3. Security Architecture and Engineering", text: "What is the primary purpose of a digital signature?", options: ["A. To provide authenticity and non-repudiation", "B. To encrypt data", "C. To compress data", "D. To generate random numbers"], correct: "A", type: "single", hasAnswer: false },
      { id: 103, domain: "3. Security Architecture and Engineering", text: "What encryption technology should an online banking platform use to ensure secure web-based transactions, maintaining confidentiality and integrity of the financial data during transmission?", options: ["A. Symmetric key encryption", "B. Digital signatures", "C. Transport Layer Security (TLS) encryption", "D. One-time pad encryption"], correct: "C", type: "single", hasAnswer: true },
      { id: 104, domain: "3. Security Architecture and Engineering", text: "What kind of feature is the development team considering incorporating in the following scenario? A cybersecurity software company is developing a new encryption algorithm intended for highly confidential communication. The development team is considering incorporating a feature that would allow authorized individuals to decrypt messages without the usual decryption key under specific, tightly controlled circumstances, such as a court order. This feature should be undetectable to anyone analyzing the encryption algorithm and should be accessible only under predefined conditions.", options: ["A. A symmetric key system", "B. A trapdoor function", "C. A hashing algorithm", "D. A public-key infrastructure (PKI)"], correct: "B", type: "single", hasAnswer: true },
      { id: 105, domain: "3. Security Architecture and Engineering", text: "Which technique is the BEST for the spy in the following scenario to use to communicate covertly without arousing suspicion? A spy works in a high-security environment where traditional digital communication methods are heavily monitored and encrypted messages are immediately flagged and decrypted by advanced cybersecurity measures. To communicate securely with headquarters without raising suspicion, the spy needs a method to hide messages in plain sight.", options: ["A. Public-key cryptography", "B. Steganography", "C. Virtual Private Network (VPN)", "D. Advanced Encryption Standard (AES)"], correct: "B", type: "single", hasAnswer: true },
      { id: 106, domain: "3. Security Architecture and Engineering", text: "Which mathematical concept is the engineering team considering for the secure key exchange mechanism in the following scenario? A software development firm is designing a secure messaging platform for corporate clients. A primary feature of this platform is the secure exchange of encryption keys for private conversations. The engineering team is considering using a mathematical approach that allows for easy computation of keys in one direction, but the inverse computation, without specific knowledge, is computationally difficult.", options: ["A. Hash functions", "B. Elliptic curve cryptography", "C. Trapdoor functions", "D. Symmetric encryption algorithms"], correct: "C", type: "single", hasAnswer: true },
      { id: 107, domain: "3. Security Architecture and Engineering", text: "Which of these cryptographic operations is typically the fastest for processing plaintext input?", options: ["A. Asymmetric encryption using RSA with a 2048 bit key", "B. Symmetric encryption with a 128 bit key", "C. Hashing the message using SHA-3", "D. Asymmetric encryption using ECC with a 512 bit key"], correct: "C", type: "single", hasAnswer: true },
      { id: 108, domain: "3. Security Architecture and Engineering", text: "Which key should be used in a PKI operation when transmitting a message to ensure proof of origin?", options: ["A. The sender's public key should be used.", "B. The sender's private key should be used.", "C. The recipient's public key should be used.", "D. The recipient's private key should be used."], correct: "B", type: "single", hasAnswer: true },
      { id: 109, domain: "3. Security Architecture and Engineering", text: "What function does the Registration Authority (RA) serve in a Public Key Infrastructure (PKI)?", options: ["A. It creates and signs a certificate.", "B. It tracks certificate revocations.", "C. It validates the identification information supplied by the requestor of a certificate.", "D. It is used to collect the information for inclusion into the certificate."], correct: "C", type: "single", hasAnswer: true },
      { id: 110, domain: "3. Security Architecture and Engineering", text: "Which asymmetric cryptographic system provides confidentiality and nonrepudiation?", options: ["A. Rivest-Shamir-Adleman (RSA)", "B. Diffie-Hellman", "C. Blowfish", "D. Advanced Encryption Standard (AES)"], correct: "A", type: "single", hasAnswer: true },
      { id: 111, domain: "3. Security Architecture and Engineering", text: "What is HAVAL?", options: ["A. A message integrity checker that produces a 128-bit output", "B. A message integrity checker that produces a 160-bit output", "C. A message integrity checker that produces a variable length output", "D. A symmetrical encryption algorithm"], correct: "C", type: "single", hasAnswer: true },
      { id: 112, domain: "3. Security Architecture and Engineering", text: "Which of the following BEST describes a digital signature?", options: ["A. A symmetric encrypted plaintext message further encrypted using the sender's private key", "B. A symmetric encrypted plaintext message further encrypted using the recipient's public key", "C. A hash digest of a plaintext message further encrypted using the recipient's public key", "D. A hash digest of a plaintext message further encrypted using the sender's private key"], correct: "D", type: "single", hasAnswer: true },
      { id: 113, domain: "3. Security Architecture and Engineering", text: "Which of the following cryptographic methods is MOST effective for a cybersecurity consultant who is tasked with advising a technology firm on the best cryptographic method to ensure messages sent through an application maintain their integrity from sender to receiver?", options: ["A. Employ symmetric encryption using Advanced Encryption Standard (AES) to encrypt all messages.", "B. Utilize a Hash-based Message Authentication Code (HMAC) with a secure hashing algorithm like SHA-256.", "C. Implement Transport Layer Security (TLS) for end-to-end encrypted message transmission.", "D. Rely on Elliptic Curve Cryptography (ECC) for generating cryptographic keys for message encryption."], correct: "B", type: "single", hasAnswer: true },
      { id: 114, domain: "3. Security Architecture and Engineering", text: "In which cryptanalytical technique does the attacker have access to the decryption device or software and attempts to defeat the cryptographic protection by decrypting pieces of ciphertext to see what the corresponding plaintext is to discover the key?", options: ["A. A known ciphertext attack", "B. A ciphertext-only attack", "C. A chosen ciphertext attack", "D. A known plaintext attack"], correct: "C", type: "single", hasAnswer: true },
      { id: 115, domain: "3. Security Architecture and Engineering", text: "Which of the following cryptographic methods is MOST effective for a cybersecurity consultant who is tasked with advising a technology firm on the best cryptographic method to ensure messages sent through an application maintain their integrity from sender to receiver?", options: ["A. Employ symmetric encryption using Advanced Encryption Standard (AES) to encrypt all messages.", "B. Utilize a Hash- based Message Authentication Code (HMAC) with a secure hashing algorithm like SHA-256.", "C. Implement Transport Layer Security (TLS) for end- to- end encrypted message transmission.", "D. Rely on Elliptic Curve Cryptography (ECC) for generating cryptographic keys for message encryption."], correct: "B", type: "single", hasAnswer: true },
      { id: 116, domain: "3. Security Architecture and Engineering", text: "In which cryptanalytical technique does the attacker have access to the decryption device or software and attempts to defeat the cryptographic protection by decrypting pieces of ciphertext to see what the corresponding plaintext is to discover the key?", options: ["A. A known ciphertext attack", "B. A ciphertext- only attack", "C. A chosen ciphertext attack", "D. A known plaintext attack"], correct: "C", type: "single", hasAnswer: true },
      { id: 117, domain: "3. Security Architecture and Engineering", text: "Which of these statements MOST likely explains the attacker's method for exploiting the Kerberos system in the following scenario? An II security team is investigating a recent breach in their organization's network that employs a Kerberos- based authentication system. Initial findings indicate the attacker did not directly compromise any user passwords or decrypt Kerberos tickets. However, the attacker was able to impersonate several users and gain unauthorized access to multiple services within the network.", options: ["A. The attacker used a 'Pass the Ticket' attack, forging Kerberos tickets to gain unauthorized access.", "B. The attacker executed a 'Pass the Hash' attack, utilizing the hashed credentials of users to mimic authentication requests.", "C. The attacker conducted a replay attack, reusing valid authentication responses to trick the system into granting access.", "D. The attacker performed a man- in- the- middle attack, intercepting and altering Kerberos tickets in transit."], correct: "A", type: "single", hasAnswer: true },
      { id: 118, domain: "3. Security Architecture and Engineering", text: "The Uptime Institute is an industry organization that provides data center operators with certification of their facilities. Their Tiered Classification System consists of four tiers. Which tier requires a concurrently maintainable site infrastructure?", options: ["A. Tier I", "B. Tier II", "C. Tier III", "D. Tier IV"], correct: "C", type: "single", hasAnswer: true },
      { id: 119, domain: "3. Security Architecture and Engineering", text: "Which set of the following groups of controls would BEST meet the needs of a client who has asked for help preventing as many threats to site security as possible?", options: ["A. CCTV, RFID door access control systems, and VESA fire detection systems", "B. Personnel screening, RFID door access control systems, and perimeter fencing", "C. Glass-break sensors, CCTV around points of ingress/egress, and a monitored alarm service", "D. Personnel screening, CCTV, and UPS protection for critical systems"], correct: "B", type: "single", hasAnswer: true },

      // ========== DOMAIN 4: Communication and Network Security ==========
      { id: 124, domain: "4. Communication and Network Security", text: "As of 2024, there are how many public, root Domain Name Servers (DNS)?", options: ["A.13", "B.50", "C.500", "D.1 million"], correct: "A", type: "single", hasAnswer: true },
      { id: 125, domain: "4. Communication and Network Security", text: "Lightweight Directory Access Protocol (LDAP) is a lookup protocol that uses a hierarchical tree structure for data entries. Common attributes for LDAP include all but one of the following?", options: ["A. Distinguished Name (DN)", "B. Real Distinguished Name (RDN)", "C. Common Name (CN)", "D. Organizational Unit (OU)"], correct: "B", type: "single", hasAnswer: true },
      { id: 126, domain: "4. Communication and Network Security", text: "Which of these issues is the MOST likely cause of the intermittent problems users are experiencing in the following scenario? A network administrator is troubleshooting an issue reported by users in an organization. The users are experiencing intermittent problems when trying to access external websites. Sometimes the websites load successfully, but often, users receive a message indicating the website cannot be found. Internal network resources are not affected, and the internet connection is stable.", options: ["A. The LDAP server is experiencing sporadic downtime.", "B. There is a malfunctioning switch in the internet.", "C. The DNS server is intermittently failing to resolve domain names.", "D. The DHCP server is not properly assigning IP addresses."], correct: "C", type: "single", hasAnswer: true },
      { id: 127, domain: "4. Communication and Network Security", text: "Which of these events is the MOST likely cause of the intermittent access issues some users are experiencing in the following scenario? T Internet is experiencing intermittent problems when trying to access external websites. Sometimes the websites load successfully, but often, users receive a message indicating the website cannot be found. Internal network resources are not affected, and the internet connection is stable.", options: ["A. The LDAP server is experiencing sporadic downtime.", "B. There is a malfunctioning switch in the internet.", "C. Network congestion is causing delays in LDAP query responses.", "D. The users experiencing issues have incorrect or outdated LDAP client configurations on their devices."], correct: "D", type: "single", hasAnswer: true },
      { id: 128, domain: "4. Communication and Network Security", text: "Internet key exchange (IKE) is a widely used method that allows two devices to exchange symmetric keys for the use of encrypting in AH or ESP. There are several ways to securely exchange keys. Which of the following is a mechanism used to exchange these keys?", options: ["A. RC4", "B. Diffie-Hellman (DH)", "C. AES", "D. ElGamal"], correct: "B", type: "single", hasAnswer: true },
      { id: 129, domain: "4. Communication and Network Security", text: "What is the BEST solution in the following scenario? A legacy industrial control system (ICS) in use transmits data across the local network using weak encryption. The application vendor cannot or will not upgrade the application to strengthen the protections applied to traffic. The application has a number of geographically distributed endpoints that are difficult to protect using physical controls.", options: ["A. As IPSec works at the presentation layer and encrypts packets, it is possible to apply IPSec in transport mode, using it to encrypt traffic across the network without requiring support from the application.", "B. As IPSec works at the network layer and encrypts packets, it is possible to apply IPSec in tunnel mode, using it to encrypt traffic across the network without requiring support from the application.", "C. As IPSec works at the presentation layer and encrypts packets, it is possible to apply IPSec in tunnel mode, using it to encrypt traffic across the network without requiring support from the application.", "D. As IPSec works at the network layer and encrypts packets, it is possible to apply IPSec in transport mode, using it to encrypt traffic across the network without requiring support from the application."], correct: "D", type: "single", hasAnswer: true },
      { id: 130, domain: "4. Communication and Network Security", text: "What protocol is used to manage multicast groups?", options: ["A.ICMP", "B.TCP", "C.IGMP", "D.UDP"], correct: "C", type: "single", hasAnswer: true },
      { id: 131, domain: "4. Communication and Network Security", text: "DORA describes the four steps taken to obtain an IP address. Which of the following is not one of those steps?", options: ["A.Discover", "B.Offer", "C.Reply", "D.Acknowledge"], correct: "C", type: "single", hasAnswer: true },
      { id: 133, domain: "4. Communication and Network Security", text: "Which type of fiber allows for data transmission of up to 80km (50 miles)?", options: ["A. Single mode", "B. Multimode", "C. Plastic optical", "D. Unachievable distance"], correct: "A", type: "single", hasAnswer: true },
      { id: 134, domain: "4. Communication and Network Security", text: "What is the BEST solution in the following scenario? A legacy industrial control system (ICS) in use transmits data across the local network using weak encryption. The application vendor cannot or will not upgrade the application to strengthen the protections applied to traffic. The application has a number of geographically distributed endpoints that are difficult to protect using physical controls.", options: ["A. As IPSec works at the presentation layer and encrypts packets, it is possible to apply IPSec in transport mode, using it to encrypt traffic across the network without requiring support from the application.", "B. As IPSec works at the network layer and encrypts packets, it is possible to apply IPSec in tunnel mode, using it to encrypt traffic across the network without requiring support from the application.", "C. As IPSec works at the presentation layer and encrypts packets, it is possible to apply IPSec in tunnel mode, using it to encrypt traffic across the network without requiring support from the application.", "D. As IPSec works at the network layer and encrypts packets, it is possible to apply IPSec in transport mode, using it to encrypt traffic across the network without requiring support from the application."], correct: "D", type: "single", hasAnswer: true },
      { id: 135, domain: "4. Communication and Network Security", text: "A switch is considered a filter or forward device and establishes one collision domain per port. What information does a Layer 2 switch use to make the decision to filter or forward?", options: ["A. MAC address", "B. IP address", "C. Both", "D. Neither"], correct: "A", type: "single", hasAnswer: true },
      { id: 136, domain: "4. Communication and Network Security", text: "Which layer of the OSI provides reliable delivery of a datagram packet?", options: ["A. Application", "B. Session", "C. Transport", "D. Network"], correct: "C", type: "single", hasAnswer: true },
      { id: 139, domain: "4. Communication and Network Security", text: "Which network topology provides a second ring for failover?", options: ["A. Ring", "B. Fiber Distributed Data Interface (FDDI)", "C. Tree", "D. Personal Area Network (PAN)"], correct: "B", type: "single", hasAnswer: true },
      { id: 142, domain: "4. Communication and Network Security", text: "Which generation of cellular networking introduced support for Long Term Evolution (LTE) and provided transmission speeds of up to 100 Mbps?", options: ["A.2G", "B.3G", "C.4G", "D.5G"], correct: "C", type: "single", hasAnswer: true },
      { id: 143, domain: "4. Communication and Network Security", text: "In software-defined networking (SDN), what happens at the control plane?", options: ["A. Business applications are managed.", "B. Node functionality is managed.", "C. Network elements can be found.", "D. None of these."], correct: "B", type: "single", hasAnswer: true },
      { id: 144, domain: "4. Communication and Network Security", text: "What are the principal benefits of software defined networking (SDN)? (Select all that apply)", options: ["A. It is possible to better optimize the network for individual applications as they transit the network.", "B. SDN reduces the management cost.", "C. SDN creates more efficient layer 2 routing policies.", "D. SDN decouples the management plane from the infrastructure plane."], correct: ["A", "B", "D"], type: "multi", hasAnswer: true },
      { id: 145, domain: "4. Communication and Network Security", text: "Your network engineer has configured a firewall rule blocking port 50 to 100. Users complain of network problems. Which of the following services will have been blocked?", options: ["A. SMTP", "B.DNS", "C.POP3", "D.IMAP"], correct: "A", type: "single", hasAnswer: true },

      // ========== DOMAIN 5: Identity and Access Management ==========
      { id: 146, domain: "5. Identity and Access Management", text: "Access control systems should mediate all access requests; they control all access. To do so, the system must first be able to identify which of the following?", options: ["A. People and objects", "B. Systems and data", "C. Subjects and data", "D. Subjects and objects"], correct: "D", type: "single", hasAnswer: true },
      { id: 147, domain: "5. Identity and Access Management", text: "Which type of access control system can authorize or deny an individual user's ability to use IT systems, resources, or assets, and has the capability to assign different access privileges to different users depending on their role in the organization?", options: ["A. Logical", "B. Physical", "C. Mandatory", "D. Discretionary"], correct: "A", type: "single", hasAnswer: true },
      { id: 150, domain: "5. Identity and Access Management", text: "Within IAM, the term triple A (AAA) is often heard. Two of the As are authentication and accounting. What is the third?", options: ["A. Access", "B. Authorization", "C. Acceptance", "D. Acceptability"], correct: "B", type: "single", hasAnswer: true },
      { id: 151, domain: "5. Identity and Access Management", text: "Multifactor authentication (MFA) is a mechanism used to verify the assertion of an identity by using which of the following?", options: ["A. A password", "B. A token", "C. A physical characteristic", "D. Two or more pieces of different types of evidence"], correct: "D", type: "single", hasAnswer: true },
      { id: 154, domain: "5. Identity and Access Management", text: "Which aspect of the AAA framework is MOST likely causing the user's access issue in the following scenario? An IT Security Analyst in a large corporation receives a report from a user experiencing difficulties accessing a critical business application. The user, who recently had their role changed within the company, reports that upon attempting to log in, they receive an error message stating, 'Access denied.' The user confirms they are entering their credentials correctly. Prior to their role change, they had regular access to this application.", options: ["A. Authentication, as the user is entering their credentials incorrectly", "B. Authorization, as there is a potential mismatch between the user's new role and the access permissions set in the application", "C. Accounting, as there might be issues with logging and monitoring of the user's access attempts", "D. Authentication, as the application does not recognize the user's credentials after the role change."], correct: "B", type: "single", hasAnswer: true },
      { id: 155, domain: "5. Identity and Access Management", text: "When different organizations need to share common information, what solutions might be sought?", options: ["A. Federated identity management (FIM)", "B. Credential management", "C. A cloud", "D. Shared identity stores"], correct: "A", type: "single", hasAnswer: true },
      { id: 158, domain: "5. Identity and Access Management", text: "Which directory services are a cut- down version of the X.500 directory access protocol?", options: ["A. Active Directory (AD)", "B. Novell Directory Service (NDS)", "C. Lightweight Directory Access Protocol (LDAP)", "D. X.509"], correct: "C", type: "single", hasAnswer: true },
      { id: 159, domain: "5. Identity and Access Management", text: "What function does a credential management system perform?", options: ["A. It is a repository for user and computer accounts.", "B. It is the binding between an authenticator and an identifier.", "C. It is used to create user accounts.", "D. It is used to create machine accounts."], correct: "B", type: "single", hasAnswer: true },
      { id: 162, domain: "5. Identity and Access Management", text: "What component, found in Kerberos, is responsible for creating and issuing access tokens to authenticated users?", options: ["A. Ticket Granting Ticket (TGT)", "B. Key Distribution Center (KDC)", "C. TGS", "D. Active Directory (AD)"], correct: "C", type: "single", hasAnswer: true },
      { id: 163, domain: "5. Identity and Access Management", text: "Which of the following is an example of an identity store?", options: ["A. Kerberos", "B. LDAP", "C. All the above", "D. X.500"], correct: "C", type: "single", hasAnswer: true },
      { id: 164, domain: "5. Identity and Access Management", text: "Which component in Security Assertion Markup Language (SAML) defines how attributes, authentication, and authorization are exchanged?", options: ["A. Profiles", "B. Protocols", "C. Bindings", "D. Assertions"], correct: "D", type: "single", hasAnswer: true },
      { id: 165, domain: "5. Identity and Access Management", text: "What does a user present to request a service ticket in Kerberos?", options: ["A. BGT", "B. KGTc", "C. TGT", "D. JWT"], correct: "C", type: "single", hasAnswer: true },
      { id: 166, domain: "5. Identity and Access Management", text: "Which protocols are associated with SAML? Select all that apply.", options: ["A. XML", "B. JSON", "C. HTTP", "D. SOAP"], correct: ["A", "C", "D"], type: "multi", hasAnswer: true },
      { id: 167, domain: "5. Identity and Access Management", text: "Which of these events BEST describes a plausible method by which an attacker could have exploited the Kerberos system in the following scenario? An international corporation has recently implemented a Kerberos-based authentication system for enhancing the security of its internal networks and systems. Despite rigorous security protocols, a breach was detected in their network. Upon investigation, it was found that the breach was facilitated through an attack on the Kerberos authentication mechanism.", options: ["A. The attacker executed a Cross-Site Scripting (XSS) attack on the company's internal web applications, hoping to steal a user's ticket-granting ticket (TGT) through malicious scripting.", "B. The attacker exploited a weakness in the password policy, performing a brute-force attack to guess a user's password and subsequently obtain valid Kerberos tickets.", "C. The attacker utilized a 'Golden Ticket' attack, creating a ticket-granting ticket (TGT) with elevated privileges to access multiple services.", "D. The attacker conducted a Distributed Denial of Service (DDoS) attack on the Kerberos server, disrupting the authentication services and exploiting the fallback security mechanisms."], correct: "C", type: "single", hasAnswer: true },

      // ========== DOMAIN 6: Security Assessment and Testing ==========
      { id: 170, domain: "6. Security Assessment and Testing", text: "Which of the following activities is MOST critical for a company undergoing an audit for SOC2 Type II compliance to demonstrate ongoing adherence to the SOC2 processing integrity principle?", options: ["A. Conducting frequent penetration tests to identify potential vulnerabilities in the system", "B. Regularly reviewing and updating the data retention and disposal policies", "C. Implementing and reviewing detailed logs of all system processing activities", "D. Ensuring all employees attend annual data protection and privacy training"], correct: "C", type: "single", hasAnswer: true },
      { id: 173, domain: "6. Security Assessment and Testing", text: "Your organization develops security-as-a-service software that is consumed via your private cloud. You employ 50 developers that practice Agile discipline in releasing tools to market. A potential client approaches your organization with the intent to acquire your services. Before the potential client commits to a contractual agreement, they have informed your organization that they need to be provided with the highest degree of assurance possible that risks to your operational effectiveness are well contained or mitigated, and they will receive your services delivered in the same operable form they were created in without being changed. For the potential client to understand the probability that your department of 50 developers remain properly compensated and incentivized to continue to support the security-as-a-service that they wish to consume, what report might they consider?", options: ["A. SOC 2 Type II", "B. SOC 2 Type I", "C. SOC 1 Type II", "D. SOC 1 Type I"], correct: "C", type: "single", hasAnswer: true },
      { id: 174, domain: "6. Security Assessment and Testing", text: "Which is NOT one of the four steps carried out during an internal assessment?", options: ["A. Chartering", "B. Testing", "C. Reporting", "D. Correction"], correct: "D", type: "single", hasAnswer: true },
      { id: 175, domain: "6. Security Assessment and Testing", text: "If an organization's security assessment and testing plans include both internal and external testing, in what order should the test be performed?", options: ["A. Internal testing should be performed first.", "B. Always choose based on a cost/benefit analysis.", "C. External testing should always be performed first.", "D. Internal and external should be performed simultaneously."], correct: "C", type: "single", hasAnswer: true },
      { id: 176, domain: "6. Security Assessment and Testing", text: "Which type of testing would inform an organization of the vulnerabilities that could be exploited by a bad actor with little or no information about the organization's systems?", options: ["A. Internal", "B. Horizontal", "C. External", "D. White box"], correct: "C", type: "single", hasAnswer: true },
      { id: 177, domain: "6. Security Assessment and Testing", text: "Which type of audit is an evaluation against compliance requirements and performed by individuals outside of the organization?", options: ["A. Formal", "B. Informal", "C. Semiformal", "D. It can be either formal or informal."], correct: "A", type: "single", hasAnswer: true },
      { id: 178, domain: "6. Security Assessment and Testing", text: "The SOC 2 (System and Organization Controls) defines five Trust Services Criteria. Which of the following is NOT included?", options: ["A. Security", "B. Authentication", "C. Privacy", "D. Process integrity"], correct: "B", type: "single", hasAnswer: true },
      { id: 179, domain: "6. Security Assessment and Testing", text: "Which of the following scenarios BEST illustrates the application of a penetration testing approach, as opposed to a vulnerability assessment, for an organization enhancing its cybersecurity measures and evaluating testing methodologies?", options: ["A. The cybersecurity team uses software to scan the network for known vulnerabilities in its systems and software.", "B. A team of ethical hackers is hired to simulate an attack on the institution's network to identify and exploit potential security weaknesses.", "C. The IT department regularly updates its systems and applies patches to address known security vulnerabilities.", "D. An automated tool is deployed to continuously monitor the network for unusual activity that could indicate a security breach."], correct: "B", type: "single", hasAnswer: true },
      { id: 182, domain: "6. Security Assessment and Testing", text: "Tests are generally categorized in one of two ways: either compliance tests or ______ tests.", options: ["A. Substantive", "B. Substantial", "C. Informative", "D. General"], correct: "A", type: "single", hasAnswer: true },
      { id: 183, domain: "6. Security Assessment and Testing", text: "Which publication, framework or guidance includes the following management review activities? Exemptions from normal activities, Information related to previous reviews, Ongoing metrics related to outcomes, Results of audits, When security objectives have been met", options: ["A. ISO/IEC 27001", "B. NIST", "C. ITIL", "D. All the above"], correct: "D", type: "single", hasAnswer: true },
      { id: 184, domain: "6. Security Assessment and Testing", text: "Which of the following can be likened to peering into the future?", options: ["A. KPIs", "B. KRIs", "C. Log files, as what has happened before is likely to happen again.", "D. Assessment programs"], correct: "B", type: "single", hasAnswer: true },
      { id: 185, domain: "6. Security Assessment and Testing", text: "What is a POA&M?", options: ["A. Plan of Activities and Mediation", "B. Process of Actions and Methods", "C. Principle of Activities and Milestones", "D. Plan of Action and Milestones"], correct: "D", type: "single", hasAnswer: true },
      { id: 186, domain: "6. Security Assessment and Testing", text: "Chartering is one of the steps carried out during an internal assessment. Which of the following activities is not part of the chartering process?", options: ["A. Management's commitment", "B. Scoping the assessment", "C. Tailoring the solutions", "D. Risk assessment"], correct: "C", type: "single", hasAnswer: true },
      { id: 187, domain: "6. Security Assessment and Testing", text: "What is the appropriate document the project manager should develop to guide the remediation process, given the United States (U.S.) government security standards, in the following scenario? A government contractor specializing in cybersecurity solutions is working on a project that involves securing a federal agency's information systems. During a recent security assessment, several weaknesses were identified in the agency's systems, necessitating immediate and structured action to remediate these vulnerabilities. The project manager decides to create a formal document that outlines the specific steps for addressing these weaknesses, along with timelines for completion and milestones for tackling progress.", options: ["A. Plan of Activities and Mediation", "B. Process of Actions and Methods", "C. Principle of Activities and Milestones", "D. Plan of Action and Milestones"], correct: "D", type: "single", hasAnswer: true },

      // ========== DOMAIN 7: Security Operations ==========
      { id: 192, domain: "7. Security Operations", text: "Which of these actions does NOT maintain the integrity of the forensic investigation in the following scenario? During an internal security audit of a financial organization, a team discovers irregularities suggesting potential insider trading. The Chief Information Security Officer (CISO) initiates a forensic investigation to uncover the truth. Given the sensitive nature of the investigation and the potential legal implications, certain principles must guide the forensic team's actions.", options: ["A. Implementing strict access controls to the investigation data and ensuring only authorized personnel involved in the investigation have access to sensitive information", "B. Informing all employees via a company-wide email about the ongoing investigation to discourage potential tampering or destruction of evidence", "C. Ensuring all data collection and analysis methods comply with relevant laws and regulations to maintain the admissibility of evidence in any future legal proceedings", "D. Temporarily suspending certain employee rights, such as privacy in communications and personal data access, without obtaining proper authorization or following due legal processes."], correct: "D", type: "single", hasAnswer: true },
      { id: 193, domain: "7. Security Operations", text: "Which of these actions is BEST in the following scenario? A digital forensics team is investigating a high-profile data breach case. They have recovered a crucial piece of evidence, a file suspected of containing sensitive stolen data. To maintain the integrity of the investigation and ensure admissibility in court, the team decided to employ digital signatures. They must use the digital signatures properly to maintain the chain of custody for this digital evidence.", options: ["A. Creating a digital signature of the file immediately upon recovery and storing the signed file on a network drive accessible to all team members", "B. Generating a digital signature for the file and documenting it in the chain of custody log, with restricted access to the signed file and log", "C. Forwarding the file via email to all team members, asking them to acknowledge receipt and create individual digital signatures", "D. Uploading the file to a public cloud storage service and generating a digital signature to share with external consultants for analysis"], correct: "B", type: "single", hasAnswer: true },
      { id: 194, domain: "7. Security Operations", text: "During a forensic investigation, the investigator must establish a list of all artifacts that may be pertinent to the case. Which of the following would be an artifact?", options: ["A. Furniture", "B. Laptops", "C. Printed documents", "D. All the above"], correct: "D", type: "single", hasAnswer: true },
      { id: 195, domain: "7. Security Operations", text: "Which of the following items should be included in a comprehensive list of digital artifacts relevant to a forensic investigation of corporate espionage?", options: ["A. The organization's general IT policies and procedures manual", "B. Timestamps of file modifications on the suspect's computer", "C. The financial performance reports of the company for the past quarter", "D. The personal opinions of employees about the suspected individual"], correct: "B", type: "single", hasAnswer: true },
      { id: 196, domain: "7. Security Operations", text: "What network-attached device monitors the network and automatically mitigates the effects of an incident when malicious activity is detected?", options: ["A. Hub", "B. IDS", "C. Concentrator", "D. IPS"], correct: "D", type: "single", hasAnswer: true },
      { id: 199, domain: "7. Security Operations", text: "How do indicators differ from precursors when discussing continuity of operations?", options: ["A. Precursors are event signals that suggest a possible incident may occur, while indicators are signals that an incident is in progress or has happened.", "B. Indicators are event signals that suggest a possible incident may occur, while precursors are signals that an incident is in progress or has happened.", "C. There is no difference.", "D. Precursors are used during disaster recovery, while indicators are used in incident response."], correct: "A", type: "single", hasAnswer: true },
      { id: 200, domain: "7. Security Operations", text: "What is threat intelligence?", options: ["A. A structured process of identifying organizational threats", "B. A structured process to manage risk", "C. A structured process to measure impact on the business", "D. All the above"], correct: "A", type: "single", hasAnswer: true },
      { id: 202, domain: "7. Security Operations", text: "What is meant by separation of duties (SoD)?", options: ["A. It is the concept of giving users the lowest level of permissions.", "B. It is the process of restricting access based on more than role or clearance level.", "C. It is the process of restricting an individual from fully completing a trusted process.", "D. It is the process of periodically swapping users' job roles."], correct: "C", type: "single", hasAnswer: true },
      { id: 203, domain: "7. Security Operations", text: "When addressing an organization's forensic investigation requirement, which ISO standard addresses assuring suitability and adequacy of incident investigation methods?", options: ["A. ISO/IEC 27037", "B. ISO/IEC 27041", "C. ISO/IEC 27042", "D. ISO/IEC 27043"], correct: "B", type: "single", hasAnswer: true },
      { id: 204, domain: "7. Security Operations", text: "According to the NIST forensic cycle, once a forensic investigation is initiated, it will be conducted in four general phases. During which phase should an organization's forensic readiness be addressed?", options: ["A. Collection", "B. Examination", "C. Analysis", "D. Reporting"], correct: "A", type: "single", hasAnswer: true },
      { id: 209, domain: "7. Security Operations", text: "Mitigating an attack involves two logically separate tasks: eradication and _____.", options: ["A. Identification", "B. Containment", "C. Remediation", "D. Recovery"], correct: "C", type: "single", hasAnswer: true },
      { id: 210, domain: "7. Security Operations", text: "IDS/IPS systems can detect malicious activity in several different ways. Which detection mechanism looks for known attack patterns?", options: ["A. Pattern matching", "B. Signature matching", "C. Deviation", "D. Heuristics"], correct: "B", type: "single", hasAnswer: true },
      { id: 211, domain: "7. Security Operations", text: "Which answer BEST describes something each individual in the following scenario does NOT have regarding the other's project? Two individuals work for an organization that has created clearance levels for its personnel and classification levels for its assets. These individuals have Level 3 clearance, but they work in different offices on different projects. When they meet for lunch, they are not allowed to discuss the details of their respective projects.", options: ["A. Least privilege", "B. Need to know", "C. Level of clearance", "D. All the above"], correct: "B", type: "single", hasAnswer: true },
      { id: 212, domain: "7. Security Operations", text: "Information Technology Infrastructure Library (ITIL) distinguishes changes based on urgency. Which of the following is not one of those levels?", options: ["A. Standard", "B. Critical", "C. Normal", "D. Emergency"], correct: "B", type: "single", hasAnswer: true },
      { id: 213, domain: "7. Security Operations", text: "What is typically used to validate the integrity of a backup?", options: ["A. Measuring the size of the original data and comparing it to the size of the backup", "B. Some form of integrity check", "C. An algorithm developed by the backup software manufacturer", "D. Restoration of the backup to a different location and then an integrity check"], correct: "D", type: "single", hasAnswer: true },
      { id: 214, domain: "7. Security Operations", text: "Which of these approaches aligns BEST with the strategy in the following scenario? An e-commerce company has experienced data loss due to a server failure, highlighting the need for a more robust data backup strategy. The IT manager decides to implement a 3-2-1 backup strategy to ensure data integrity and availability.", options: ["A. Store one copy of the data on the company's local server, another copy on an external hard drive kept in the office, and a third copy on cloud storage.", "B. Keep all three copies of the data on different servers within the company's local data center to ensure high data availability.", "C. Use one cloud storage provider for two copies of the data and keep a third copy on a local server within the company.", "D. Store two copies of the data on physical tapes in two separate office locations and keep a third copy on the company's main server."], correct: "A", type: "single", hasAnswer: true },
      { id: 215, domain: "7. Security Operations", text: "What is continuous data protection (CDP)?", options: ["A. A differential backup", "B. An incremental backup", "C. A type of snapshotting", "D. A full backup"], correct: "C", type: "single", hasAnswer: true },
      { id: 218, domain: "7. Security Operations", text: "Your organization has an agreement with another party to share operational locations in the event of a disaster. What type of recovery option is this?", options: ["A. Cloud", "B. Joint operating agreement (JOA)", "C. Hot site", "D. Mirrored site"], correct: "B", type: "single", hasAnswer: true },
      { id: 219, domain: "7. Security Operations", text: "The concept of High Availability (HA) includes all the following elements. However, which provides a redundancy solution for data?", options: ["A. Uninterruptable power supplies (UPS)", "B. Clustering", "C. Sufficient spare components", "D. RAID"], correct: "D", type: "single", hasAnswer: true },
      { id: 220, domain: "7. Security Operations", text: "What is the BEST action for the hospital to take in the following scenario? A regional hospital with a 24/7 emergency department is upgrading its IT infrastructure. The hospital's network supports critical systems including electronic health records (EHR), medical imaging, and life-support equipment. Maintaining the high availability of these systems is crucial, as any downtime could have serious implications for patient care. The hospital is located in an area prone to short-term power outages that can extend for longer periods?", options: ["A. Install a basic Uninterruptible Power Supply (UPS) system for the entire hospital.", "B. Implement an advanced Uninterruptible Power Supply (UPS) system with scalable runtime for critical systems only.", "C. Use a standard Uninterruptible Power Supply (UPS) for the EHR system and rely on backup generators for other systems.", "D. Opt for a multi-layered approach with an Uninterruptible Power Supply (UPS) for all critical systems and backup generators for the entire hospital."], correct: "D", type: "single", hasAnswer: true },
      { id: 221, domain: "7. Security Operations", text: "When testing an organization's business continuity and disaster recovery procedures, would the use of smoke grenades during a building evacuation test be a good idea?", options: ["A. Yes.", "B. No.", "C. Possibly, but it would need to be carefully considered, planned, and executed", "D. Possibly, if it increases employee morale."], correct: "C", type: "single", hasAnswer: true },

      // ========== DOMAIN 8: Software Development Security ==========
      { id: 224, domain: "8. Software Development Security", text: "The Software Engineering Institute's Software Capability Maturity Model Integration (CMMI) focuses on which of the following?", options: ["A. Software development methodologies", "B. Systems integration", "C. Process management", "D. Software testing and evaluation"], correct: "C", type: "single", hasAnswer: true },
      { id: 225, domain: "8. Software Development Security", text: "Which level in the Software Engineering Institute's Software Capability Maturity Model (CMM) defines processes as controlled using quantitative techniques?", options: ["A. Repeatable", "B. Defined", "C. Managed", "D. Optimizing"], correct: "C", type: "single", hasAnswer: true },
      { id: 228, domain: "8. Software Development Security", text: "When thinking about malware, is a hoax dangerous?", options: ["A. Yes, always", "B. No, never", "C. Sometimes", "D. Both A and B"], correct: "C", type: "single", hasAnswer: true },
      { id: 229, domain: "8. Software Development Security", text: "First noticed in 2010, Stuxnet is an example of an advanced persistent threat (APT). APT is another name for which of the following?", options: ["A. A class of trojans", "B. A class of viruses", "C. A class or worms", "D. Multidimensional attacks"], correct: "D", type: "single", hasAnswer: true },
      { id: 230, domain: "8. Software Development Security", text: "Which type of virus does not actually touch the target file but instead takes advantage of precedence within the system?", options: ["A. Multipartite", "B. Boot sector infector", "C. Companion", "D. Script"], correct: "C", type: "single", hasAnswer: true },
      { id: 231, domain: "8. Software Development Security", text: "Software design errors that induce an application to malfunction when an attacker provides unvalidated information are best described as what weakness?", options: ["A. Buffer overflow", "B. Race condition", "C. SQL", "D. Malformed input"], correct: "D", type: "single", hasAnswer: true },
      { id: 232, domain: "8. Software Development Security", text: "Databases are vulnerable to several types of attacks. Which of the following attacks allows an authorized user to obtain more information from a database than was originally intended?", options: ["A. Bypass", "B. Inference", "C. Aggregation", "D. Aggregation and inference combined"], correct: "D", type: "single", hasAnswer: true },
      { id: 233, domain: "8. Software Development Security", text: "When considering databases, what is a 'deadly embrace'?", options: ["A. Data contamination", "B. A deadlock", "C. A DoS", "D. None the above"], correct: "B", type: "single", hasAnswer: true },
      { id: 236, domain: "8. Software Development Security", text: "Which SQL language concept is used by database administrators to establish and control access to data?", options: ["A. DCL", "B. DML", "C. DDL", "D. DTL"], correct: "A", type: "single", hasAnswer: true },
      { id: 237, domain: "8. Software Development Security", text: "Procedural and object-oriented programming provide ways to handle the management of complex sets of software. Which of the following is not one of them?", options: ["A. Code reuse", "B. Reforming", "C. Refactoring", "D. Data modeling"], correct: "B", type: "single", hasAnswer: true },
      { id: 239, domain: "8. Software Development Security", text: "Which of the following would not be classified as a nonfunctional requirement?", options: ["A. Performance", "B. Scalability", "C. Usability", "D. They are all examples of nonfunctional requirements."], correct: "D", type: "single", hasAnswer: true },
      { id: 240, domain: "8. Software Development Security", text: "At a minimum, database models need to provide security controls, the ability to be shared by multiple users, fault tolerance and recovery, and what else?", options: ["A. Transaction persistence", "B. The ability to back up the data", "C. Different user levels", "D. The ability to survive a hardware failure"], correct: "A", type: "single", hasAnswer: true }
    ];

    // Organize by domain: Non-AI (hasAnswer: true) first, then AI-powered (hasAnswer: false), both sorted by id
    const domainOrder = ["1. Security and Risk Management", "2. Asset Security", "3. Security Architecture and Engineering", "4. Communication and Network Security", "5. Identity and Access Management", "6. Security Assessment and Testing", "7. Security Operations", "8. Software Development Security"];
    const grouped = {};
    ALL_UNIQUE_QUESTIONS.forEach(q => {
      if (!grouped[q.domain]) grouped[q.domain] = [];
      grouped[q.domain].push(q);
    });
    let orderedQuestions = [];
    for (const dom of domainOrder) {
      if (grouped[dom]) {
        const nonAI = grouped[dom].filter(q => q.hasAnswer === true).sort((a, b) => a.id - b.id);
        const ai = grouped[dom].filter(q => q.hasAnswer === false).sort((a, b) => a.id - b.id);
        orderedQuestions.push(...nonAI, ...ai);
      }
    }
    const QUESTIONS = orderedQuestions;

    // UI State
    let userSelections = QUESTIONS.map(() => null);
    let submitted = false;
    let finalScore = 0;

    const container = document.getElementById('questionsContainer');
    const totalSpan = document.getElementById('totalCount');
    const answeredSpan = document.getElementById('answeredCount');
    const scoreSpan = document.getElementById('scorePreview');

    function updateStats() {
      let answered = 0;
      QUESTIONS.forEach((q, idx) => {
        const sel = userSelections[idx];
        if (q.type === 'multi') answered += (sel && Array.isArray(sel) && sel.length > 0) ? 1 : 0;
        else answered += (sel !== null) ? 1 : 0;
      });
      totalSpan.innerText = `${QUESTIONS.length} questions`;
      answeredSpan.innerText = `📌 answered: ${answered}`;
      scoreSpan.innerText = submitted ? `⭐ score: ${finalScore}/${QUESTIONS.length}` : `⭐ pending`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    function renderAll() {
      container.innerHTML = '';
      let currentDomain = '';
      QUESTIONS.forEach((q, idx) => {
        if (q.domain !== currentDomain) {
          currentDomain = q.domain;
          const domainDiv = document.createElement('div');
          domainDiv.className = 'domain-section';
          domainDiv.innerHTML = `<div class="domain-header">📁 ${escapeHtml(currentDomain)}</div>`;
          container.appendChild(domainDiv);
        }
        const card = document.createElement('div');
        card.className = `question-card ${!q.hasAnswer ? 'ai-powered' : ''}`;
        const selected = userSelections[idx];
        let optionsHtml = '';
        if (q.type === 'multi') {
          optionsHtml = q.options.map((opt, optIdx) => {
            const letter = String.fromCharCode(65 + optIdx);
            const checked = (selected && Array.isArray(selected) && selected.includes(letter)) ? 'checked' : '';
            return `<div class="option"><input type="checkbox" name="q${idx}" value="${letter}" id="q${idx}_${letter}" ${checked} ${submitted ? 'disabled' : ''}><label for="q${idx}_${letter}">${escapeHtml(opt)}</label></div>`;
          }).join('');
        } else {
          optionsHtml = q.options.map((opt, optIdx) => {
            const letter = String.fromCharCode(65 + optIdx);
            const checked = (selected === letter) ? 'checked' : '';
            return `<div class="option"><input type="radio" name="q${idx}" value="${letter}" id="q${idx}_${letter}" ${checked} ${submitted ? 'disabled' : ''}><label for="q${idx}_${letter}">${escapeHtml(opt)}</label></div>`;
          }).join('');
        }
        let resultHtml = '';
        if (submitted) {
          let isCorrect = false;
          if (q.type === 'multi') {
            const selectedArr = selected && Array.isArray(selected) ? selected : [];
            const correctArr = q.correct;
            isCorrect = selectedArr.length === correctArr.length && correctArr.every(c => selectedArr.includes(c));
          } else {
            isCorrect = (selected === q.correct);
          }
          const correctDisplay = Array.isArray(q.correct) ? q.correct.join(',') : q.correct;
          resultHtml = `<div class="result-feedback ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓ Correct' : `✗ Incorrect. Correct: ${correctDisplay}`}</div>`;
        }
        card.innerHTML = `
          <div class="question-header">
            <span class="q-id">Q${q.id}</span>
            ${!q.hasAnswer ? '<span class="ai-badge">🤖 AI-Powered Answer</span>' : ''}
            <span class="type-badge">${q.type === 'multi' ? '✓ multiple answers' : '◉ single answer'}</span>
          </div>
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div class="options">${optionsHtml}</div>
          ${resultHtml}
        `;
        const lastSection = container.lastChild;
        if (lastSection && lastSection.classList && lastSection.classList.contains('domain-section')) lastSection.appendChild(card);
        else container.appendChild(card);

        if (!submitted) {
          if (q.type === 'multi') {
            const checkboxes = card.querySelectorAll(`input[type="checkbox"][name="q${idx}"]`);
            checkboxes.forEach(cb => cb.addEventListener('change', () => {
              const checkedVals = Array.from(card.querySelectorAll(`input[type="checkbox"][name="q${idx}"]:checked`)).map(c => c.value);
              userSelections[idx] = checkedVals;
              updateStats();
            }));
          } else {
            const radios = card.querySelectorAll(`input[type="radio"][name="q${idx}"]`);
            radios.forEach(radio => radio.addEventListener('change', (e) => { userSelections[idx] = e.target.value; updateStats(); }));
          }
        }
      });
      updateStats();
    }

    function submitExam() {
      if (submitted) return;
      let correctCount = 0;
      QUESTIONS.forEach((q, idx) => {
        const selected = userSelections[idx];
        if (q.type === 'multi') {
          const selectedArr = selected && Array.isArray(selected) ? selected : [];
          const correctArr = q.correct;
          if (selectedArr.length === correctArr.length && correctArr.every(c => selectedArr.includes(c))) correctCount++;
        } else {
          if (selected && selected === q.correct) correctCount++;
        }
      });
      finalScore = correctCount;
      submitted = true;
      renderAll();

      let rows = '';
      QUESTIONS.forEach((q, idx) => {
        const selected = userSelections[idx] ? (Array.isArray(userSelections[idx]) ? userSelections[idx].join(',') : userSelections[idx]) : '(none)';
        const correctStr = Array.isArray(q.correct) ? q.correct.join(',') : q.correct;
        rows += `<tr><td>${q.id}</td><td>${escapeHtml(selected)}</td><td>${escapeHtml(correctStr)}</td><td>${selected === correctStr ? '✓' : '✗'}</td></tr>`;
      });
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="report-modal">
          <h3>📊 Final Score: ${finalScore} / ${QUESTIONS.length}</h3>
          <div class="score-circle">${Math.round(finalScore / QUESTIONS.length * 100)}%</div>
          <div style="overflow-x:auto"><table><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
          <div style="margin-top:1rem; display:flex; gap:1rem;">
            <button id="closeReportBtn" class="export-btn">Close</button>
            <button id="exportCSVBtn" class="export-btn">📎 Export CSV Report</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('closeReportBtn').onclick = () => modal.remove();
      document.getElementById('exportCSVBtn').onclick = () => {
        let csv = "Question Number,Your Answer,Correct Answer,Status\n";
        QUESTIONS.forEach((q, idx) => {
          const selected = userSelections[idx] ? (Array.isArray(userSelections[idx]) ? userSelections[idx].join(';') : userSelections[idx]) : 'unanswered';
          const correctStr = Array.isArray(q.correct) ? q.correct.join(';') : q.correct;
          const status = (Array.isArray(userSelections[idx]) && Array.isArray(q.correct)) ?
            (userSelections[idx].sort().join() === q.correct.sort().join() ? 'Correct' : 'Incorrect') :
            (userSelections[idx] === q.correct ? 'Correct' : 'Incorrect');
          csv += `${q.id},${selected},${correctStr},${status}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `cissp_full_exam_report_${Date.now()}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      };
    }

    document.getElementById('submitFinalBtn').addEventListener('click', submitExam);
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (submitted && confirm("Reset will clear all answers and allow a new attempt.")) {
        submitted = false;
        userSelections = QUESTIONS.map(() => null);
        renderAll();
      } else if (!submitted) {
        userSelections = QUESTIONS.map(() => null);
        renderAll();
      }
    });

    renderAll();
  </script>
</body>

</html>
