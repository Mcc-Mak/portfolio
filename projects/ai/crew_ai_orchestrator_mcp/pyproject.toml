[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-crew-ai"
version = "0.3.0"
description = "MCP server that orchestrates CrewAI multi-agent workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0",
    "crewai",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mcp-crew-ai = "mcp_crew_ai.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_crew_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]