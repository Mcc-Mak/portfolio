server:
    port: 8080
spring:
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booking_appointment_system?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${SPRING_DATASOURCE_USERNAME:mccmak}
        password: ${SPRING_DATASOURCE_PASSWORD}
    jackson:
        deserialization:
            FAIL_ON_UNKNOWN_PROPERTIES: false
# MyBatis
mybatis:
  mapper-locations: classpath:/mybatis/*.xml
# mapper
mapper:
  mappers:
  # - me.hkd.springboot.mybatis.util.BaseMapper
  not-empty: false
  identity: MYSQL
